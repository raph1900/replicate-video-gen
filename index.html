<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Replicate Video Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e8; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a4a;
      padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    header .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #7c3aed, #2563eb); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }

    /* API bar */
    .api-bar {
      background: #0d0d18; border-bottom: 1px solid #1e1e32;
      padding: 10px 24px; display: flex; align-items: center; gap: 10px;
      flex-shrink: 0;
    }
    .api-bar label { font-size: 12px; color: #6b7280; white-space: nowrap; }
    .api-bar input { flex: 1; max-width: 340px; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 7px 12px; color: #e0e0e8; font-size: 13px; outline: none; }
    .api-bar input:focus { border-color: #6366f1; }
    .api-bar button { background: #6366f1; border: none; border-radius: 8px; padding: 7px 14px; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
    .gen-all-btn {
      margin-left: auto;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none; border-radius: 8px; padding: 8px 18px;
      color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .gen-all-btn:hover:not(:disabled) { opacity: 0.88; }
    .gen-all-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Tab Nav */
    .tab-nav {
      background: #0a0a0f;
      border-bottom: 2px solid #1e1e32;
      padding: 0 24px;
      display: flex;
      gap: 2px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .tab-btn {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      padding: 10px 20px;
      color: #6b7280;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: #a5b4fc; }
    .tab-btn.active { color: #a5b4fc; border-bottom-color: #6366f1; }

    /* Main layout */
    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Scene column */
    .scene-col {
      display: flex; flex-direction: column;
      border-right: 1px solid #1e1e32;
      overflow: hidden;
    }
    .scene-col:last-child { border-right: none; }

    .scene-header {
      background: #0d0d18;
      border-bottom: 1px solid #1e1e32;
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .scene-title { font-size: 13px; font-weight: 700; color: #a5b4fc; }
    .scene-status { font-size: 11px; color: #4b5563; }
    .scene-status.running { color: #a5b4fc; }
    .scene-status.done { color: #4ade80; }
    .scene-status.error { color: #f87171; }

    .scene-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .scene-body::-webkit-scrollbar { width: 4px; }
    .scene-body::-webkit-scrollbar-track { background: transparent; }
    .scene-body::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 4px; }

    /* Form fields */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px;
      padding: 8px 10px; color: #e0e0e8; font-size: 12px; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
    select option { background: #1a1a2e; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #2a2a4a; border-radius: 8px; padding: 12px;
      text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
      position: relative; overflow: hidden;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: #6366f1; background: rgba(99,102,241,0.05); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-zone p { font-size: 11px; color: #6b7280; }
    .upload-zone p strong { color: #a5b4fc; }
    .preview-img { display: none; width: 100%; border-radius: 6px; margin-top: 8px; max-height: 140px; object-fit: contain; background: #0a0a0f; }

    .badge { font-size: 9px; padding: 1px 6px; border-radius: 20px; white-space: nowrap; margin-left: auto; flex-shrink: 0; }
    .badge-featured { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .badge-fast { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-quality { background: rgba(99,102,241,0.15); color: #a5b4fc; }
    .badge-new { background: rgba(245,158,11,0.15); color: #fbbf24; }

    /* Ratio grid */
    .ratio-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .ratio-btn {
      background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 6px;
      padding: 5px 3px; text-align: center; cursor: pointer; font-size: 10px; color: #9ca3af;
      transition: all 0.15s; user-select: none;
    }
    .ratio-btn:hover { border-color: #6366f1; color: #a5b4fc; }
    .ratio-btn.active { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; font-weight: 600; }

    /* Slider */
    .slider-row { display: flex; align-items: center; gap: 8px; }
    .slider-row input[type="range"] { flex: 1; -webkit-appearance: none; height: 3px; background: #2a2a4a; border-radius: 3px; border: none; padding: 0; }
    .slider-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #6366f1; border-radius: 50%; cursor: pointer; }
    .slider-val { min-width: 28px; text-align: right; font-size: 11px; font-weight: 600; color: #a5b4fc; }

    /* Toggle */
    .toggle-row { display: flex; align-items: center; justify-content: space-between; background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 8px 10px; }
    .toggle-row .tl { font-size: 11px; color: #c4c4d4; }
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-track { position: absolute; inset: 0; background: #2a2a4a; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
    .toggle input:checked + .toggle-track { background: #6366f1; }
    .toggle-track::after { content: ''; position: absolute; width: 14px; height: 14px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s; }
    .toggle input:checked + .toggle-track::after { transform: translateX(16px); }

    /* Generate btn */
    .gen-btn {
      width: 100%; padding: 10px; background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s;
    }
    .gen-btn:hover:not(:disabled) { opacity: 0.88; }
    .gen-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Progress */
    .progress-wrap { background: #1e1e32; border-radius: 4px; height: 3px; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #7c3aed, #2563eb); border-radius: 4px; width: 40%; animation: slide 1.5s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Video output */
    .video-output { display: flex; flex-direction: column; gap: 8px; }
    .video-card {
      background: #0d0d16; border: 1px solid #1e1e32; border-radius: 10px; overflow: hidden;
    }
    .video-card-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #1e1e32; }
    .video-card-header span { font-size: 11px; font-weight: 600; color: #6b7280; }
    .video-placeholder { display: flex; align-items: center; justify-content: center; height: 130px; color: #2a2a4a; text-align: center; }
    .video-wrap { display: none; position: relative; background: #000; line-height: 0; }
    .video-wrap video { width: 100%; max-height: 200px; display: block; pointer-events: none; }
    .video-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .play-icon { width: 36px; height: 36px; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: transform 0.15s; }
    .video-overlay:hover .play-icon { transform: scale(1.1); }
    .dl-btn { display: none; width: 100%; padding: 7px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25); border-radius: 0 0 10px 10px; color: #4ade80; font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .dl-btn:hover { background: rgba(34,197,94,0.15); }

    /* Log */
    .log-box {
      background: #080810; border: 1px solid #1e1e32; border-radius: 6px;
      padding: 8px 10px; font-family: monospace; font-size: 11px; color: #4b5563;
      min-height: 80px; max-height: 220px; overflow-y: auto;
    }
    .log-box:empty::before { content: 'No output yet…'; color: #2a2a3a; }
    .log-line { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-line.info { color: #6b7280; }
    .log-line.success { color: #4ade80; }
    .log-line.error { color: #f87171; font-weight: 600; }
    .log-line.warn { color: #fbbf24; }
    .log-header { font-size: 10px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .log-clear { font-size: 9px; color: #2a2a4a; cursor: pointer; padding: 1px 6px; border: 1px solid #1e1e32; border-radius: 4px; background: none; }
    .log-clear:hover { color: #6b7280; border-color: #2a2a4a; }

    hr { border: none; border-top: 1px solid #1e1e32; }

    /* Variations */
    .var-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

    /* ============================================================
       FULL VIDEO CREATOR
       ============================================================ */
    #fvc-panel {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 24px 40px;
    }
    #fvc-panel::-webkit-scrollbar { width: 6px; }
    #fvc-panel::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 4px; }

    .fvc-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1400px;
    }

    .fvc-section {
      background: #0d0d18;
      border: 1px solid #1e1e32;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .fvc-section:last-child { margin-bottom: 0; }

    .fvc-section h3 {
      font-size: 13px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .fvc-section h3 .sub {
      font-weight: 400;
      color: #4b5563;
      font-size: 11px;
    }

    /* Image upload grid */
    .fvc-images-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .fvc-img-slot {}
    .fvc-slot-label {
      font-size: 10px;
      font-weight: 600;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    .fvc-upload-zone {
      border: 2px dashed #2a2a4a;
      border-radius: 8px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      padding: 8px;
    }
    .fvc-upload-zone:hover { border-color: #6366f1; background: rgba(99,102,241,0.05); }
    .fvc-upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .fvc-upload-zone .uz-icon { font-size: 22px; }
    .fvc-upload-zone .uz-text { font-size: 10px; color: #6b7280; text-align: center; }
    .fvc-thumb { display: none; width: 100%; height: 85px; object-fit: cover; border-radius: 6px; }
    .fvc-thumb.loaded { display: block; }

    .fvc-desc-box {
      margin-top: 7px;
      background: #080810;
      border: 1px solid #1e1e32;
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11px;
      color: #6b7280;
      min-height: 44px;
      line-height: 1.55;
    }
    .fvc-desc-box.analyzing { color: #a5b4fc; font-style: italic; }
    .fvc-desc-box.done { color: #9ca3af; font-style: normal; }
    .fvc-desc-box.err { color: #f87171; }
    .fvc-desc-box.empty::before { content: 'Description will appear here after analysis'; color: #2a2a3a; font-style: italic; }

    .fvc-analyze-btn {
      width: 100%;
      padding: 8px;
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 8px;
      color: #a5b4fc;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .fvc-analyze-btn:hover:not(:disabled) { background: rgba(99,102,241,0.18); }
    .fvc-analyze-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Chip selectors */
    .chip-section { margin-bottom: 12px; }
    .chip-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      display: block;
    }
    .chip-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 11px;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .chip:hover { border-color: #6366f1; color: #a5b4fc; }
    .chip.active { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; font-weight: 600; }

    .fvc-textarea {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px;
      color: #e0e0e8;
      font-size: 12px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }
    .fvc-textarea:focus { border-color: #6366f1; }

    .fvc-build-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .fvc-build-btn:hover:not(:disabled) { opacity: 0.88; }
    .fvc-build-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .fvc-final-prompt {
      width: 100%;
      background: #0a0a14;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px;
      color: #e0e0e8;
      font-size: 12px;
      line-height: 1.7;
      resize: vertical;
      min-height: 160px;
      outline: none;
      font-family: inherit;
    }
    .fvc-final-prompt:focus { border-color: #6366f1; }

    .fvc-gen-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #059669, #0d9488);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .fvc-gen-btn:hover:not(:disabled) { opacity: 0.88; }
    .fvc-gen-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .fvc-step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: rgba(99,102,241,0.2);
      border: 1px solid rgba(99,102,241,0.4);
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      color: #a5b4fc;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎬</div>
  <h1>Replicate Video Generator</h1>
</header>

<div class="api-bar">
  <label>API Key</label>
  <input type="password" id="api-key" placeholder="r8_..." />
  <button onclick="saveKey()">Save</button>
  <label style="margin-left:16px">Claude Key</label>
  <input type="password" id="anthropic-key" placeholder="sk-ant-..." style="max-width:260px" />
  <button onclick="saveAnthropicKey()">Save</button>
  <button onclick="syncAll()" style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:8px;padding:8px 14px;color:#a5b4fc;font-size:12px;font-weight:600;cursor:pointer;" title="Copy Scene 1 settings to all scenes">🔄 Sync Scene 1 → All</button>
  <button class="gen-all-btn" id="gen-all-btn" onclick="generateAll()">⚡ Generate All Scenes</button>
</div>

<!-- Tab Navigation -->
<div class="tab-nav">
  <button class="tab-btn active" data-tab="scenes" onclick="switchTab('scenes')">🎬 Scene Creation</button>
  <button class="tab-btn" data-tab="fvc" onclick="switchTab('fvc')">✨ Full Video Creator</button>
</div>

<div class="workspace" id="workspace"></div>

<!-- Full Video Creator Panel -->
<div id="fvc-panel"></div>

<script>
// ============================================================
// State
// ============================================================
const NUM_SCENES = 4;
const scenes = Array.from({ length: NUM_SCENES }, (_, i) => ({
  id: i,
  imageBase64: null,
  lastFrameBase64: null,
  refImages: [],
  prompt: '',
  negPrompt: '',
  model: 'bytedance/seedance-2.0',
  endpoint: 'models',
  ratio: '16:9',
  variations: 1,
  seed: '',
  sdResolution: '720p',
  sdDuration: 5,
  sdAuto: true,
  sdAudio: true,
  motion: 5,
  fps: 24,
  cfg: 7,
  duration: 5,
  aiVary: false,
  status: 'idle',
  videos: [],
  generatingCount: 0,
}));

// FVC State
const fvc = {
  images: [null, null, null],
  descriptions: ['', '', ''],
  goal: '',
  numScenes: 3,
  // Video parameters
  storyArc: '',
  pacing: '',
  tone: '',
  subject: '',
  storyNotes: '',
  // Cinematography
  angle: '',
  lighting: '',
  movement: '',
  mood: '',
  focus: '',
  // Scene prompts (one per scene)
  scenePrompts: ['', '', ''],
  model: 'bytedance/seedance-2.0',
  endpoint: 'models',
  ratio: '16:9',
  sdResolution: '720p',
  sdDuration: 5,
};

const versionCache = {};
const completedByScene = {};

const MODELS = [
  { id: 'bytedance/seedance-2.0', endpoint: 'models', name: 'Seedance 2.0 ✦', price: '480p $0.08–0.10/s · 720p $0.18–0.22/s', badge: 'Featured', cls: 'featured badge-featured' },
  { id: 'kwaivgi/kling-v1.6-standard', endpoint: 'models', name: 'Kling v1.6 Standard', price: '$0.05/sec · 5s=$0.25', badge: 'Budget', cls: 'badge-fast' },
  { id: 'kwaivgi/kling-v1.6-pro', endpoint: 'models', name: 'Kling v1.6 Pro', price: '$0.095/sec · 5s=$0.48', badge: 'Pro', cls: 'badge-quality' },
  { id: 'kwaivgi/kling-v2.0', endpoint: 'models', name: 'Kling v2.0', price: '$0.28/sec · 5s=$1.40', badge: 'New', cls: 'badge-new' },
  { id: 'kwaivgi/kling-v2.1-master', endpoint: 'models', name: 'Kling v2.1 Master', price: '$0.28/sec · 5s=$1.40', badge: 'Best', cls: 'badge-featured' },
  { id: 'minimax/video-01-live', endpoint: 'models', name: 'MiniMax Video-01 Live', price: '$0.50 flat per video', badge: 'Quality', cls: 'badge-quality' },
  { id: 'sunfjun/stable-video-diffusion', endpoint: 'versions', name: 'Stable Video Diffusion', price: '~$0.037 per run', badge: 'Cheapest', cls: 'badge-fast' },
  { id: 'wavespeedai/wan-2.1-i2v-480p', endpoint: 'versions', name: 'Wan 2.1 I2V 480p', price: '$0.09/sec · 5s=$0.45', badge: 'Open', cls: 'badge-new' },
];

// ============================================================
// Tab switching
// ============================================================
function switchTab(name) {
  document.getElementById('workspace').style.display = name === 'scenes' ? 'grid' : 'none';
  document.getElementById('fvc-panel').style.display = name === 'fvc' ? 'block' : 'none';
  // Show/hide sync+gen-all buttons (scene creation only)
  const sceneOnlyBtns = document.querySelectorAll('.gen-all-btn, [onclick="syncAll()"]');
  sceneOnlyBtns.forEach(b => b.style.display = name === 'scenes' ? '' : 'none');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
}

const savedKey = localStorage.getItem('replicate_key');
if (savedKey) document.getElementById('api-key').value = savedKey;

// ============================================================
// Scene Creation — model/ratio/var/upload/log/generate
// ============================================================
function selectModel(sid, el) {
  const selectEl = document.getElementById(`mselect-${sid}`);
  const modelId = el.tagName === 'SELECT' ? el.value : (el.dataset ? el.dataset.model : el);
  if (selectEl) selectEl.value = modelId;
  const opt = selectEl ? selectEl.querySelector(`option[value="${modelId}"]`) : null;
  scenes[sid].model = modelId;
  scenes[sid].endpoint = opt ? opt.dataset.endpoint : (MODELS.find(m => m.id === modelId)?.endpoint || 'models');

  const isSeedance = scenes[sid].model === 'bytedance/seedance-2.0';
  const isKling = scenes[sid].model.startsWith('kwaivgi/kling');
  const isSVD = scenes[sid].model === 'sunfjun/stable-video-diffusion';

  document.getElementById(`sdparams-${sid}`).style.display = isSeedance ? '' : 'none';
  document.getElementById(`commonparams-${sid}`).style.display = isSeedance ? 'none' : '';
  document.getElementById(`mfield-${sid}`).style.display = (!isKling && !isSVD) ? '' : 'none';
  document.getElementById(`fpsfield-${sid}`).style.display = (!isKling && !isSVD) ? '' : 'none';
  document.getElementById(`cfgfield-${sid}`).style.display = (!isKling && !isSVD) ? '' : 'none';

  const audioCheck = document.getElementById(`audiocheck-${sid}`);
  const audioLabel = document.getElementById(`audiolabel-${sid}`);
  const audioRow = document.getElementById(`audiorow-${sid}`);
  if (isSeedance) {
    audioCheck.disabled = false; audioRow.style.opacity = '1'; audioLabel.textContent = '';
  } else {
    audioCheck.disabled = true; audioRow.style.opacity = '0.4'; audioLabel.textContent = '(not supported by this model)';
  }
}

function selectRatio(sid, el, ratio) {
  document.querySelectorAll(`#rgrid-${sid} .ratio-btn`).forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  scenes[sid].ratio = ratio;
}

function selectVar(sid, el, v) {
  document.querySelectorAll(`#vgrid-${sid} .ratio-btn`).forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  scenes[sid].variations = v;
}

function handleImg(e, sid) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    scenes[sid].imageBase64 = ev.target.result;
    const img = document.getElementById(`ipreview-${sid}`);
    img.src = ev.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function doDragOver(e, sid) { e.preventDefault(); document.getElementById(`uzone-${sid}`).classList.add('drag-over'); }
function doDragLeave(sid) { document.getElementById(`uzone-${sid}`).classList.remove('drag-over'); }
function doDrop(e, sid) {
  e.preventDefault(); doDragLeave(sid);
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) handleImg({ target: { files: [f] } }, sid);
}

function addLog(sid, msg, type = 'info') {
  const box = document.getElementById(`log-${sid}`);
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(line); box.scrollTop = box.scrollHeight;
}
function clearLog(sid) { document.getElementById(`log-${sid}`).innerHTML = ''; }
function setStatus(sid, state, text) {
  const el = document.getElementById(`sstatus-${sid}`);
  el.className = 'scene-status ' + state;
  el.textContent = text;
}

// ============================================================
// Build input (shared between Scene Creation and FVC)
// ============================================================
function buildInputFromScene(s, seed, varIdx) {
  const prompt = (s._variedPrompts && s._variedPrompts[varIdx] != null) ? s._variedPrompts[varIdx] : s.prompt;
  const negPrompt = s.negPrompt || '';

  if (s.model === 'bytedance/seedance-2.0') {
    const input = { prompt };
    if (s.imageBase64) input.image = s.imageBase64;
    input.duration = s.sdAuto ? -1 : s.sdDuration;
    input.resolution = s.sdResolution;
    input.aspect_ratio = s.ratio;
    input.generate_audio = s.sdAudio;
    if (s.seed) input.seed = parseInt(s.seed);
    else if (seed) input.seed = seed;
    return input;
  }
  if (s.model === 'minimax/video-01-live') {
    return { first_frame_image: s.imageBase64, prompt, prompt_optimizer: true };
  }
  if (s.model === 'sunfjun/stable-video-diffusion') {
    return { input_image: s.imageBase64, video_length: '25_frames_with_svd_xt', sizing_strategy: 'maintain_aspect_ratio', frames_per_second: s.fps, motion_bucket_id: (s.motion||5) * 12, cond_aug: 0.02, decoding_t: 7, seed };
  }
  if (s.model === 'wavespeedai/wan-2.1-i2v-480p') {
    return { image: s.imageBase64, prompt, negative_prompt: negPrompt || 'blur, distortion', sample_guide_scale: s.cfg || 7, sample_steps: 30, seed, fast_mode: 'Balanced', aspect_ratio: s.ratio };
  }
  if (s.model.startsWith('kwaivgi/kling')) {
    const inp = { prompt, start_image: s.imageBase64, duration: s.duration || 5, aspect_ratio: s.ratio, cfg_scale: 0.5, seed };
    if (negPrompt) inp.negative_prompt = negPrompt;
    return inp;
  }
  return { image: s.imageBase64, prompt, seed };
}

function buildInput(sid, seed, varIdx) {
  return buildInputFromScene(scenes[sid], seed, varIdx);
}

async function varyPrompts(prompt, count) {
  const anthropicKey = getAnthropicKey();
  if (!anthropicKey) throw new Error('No Claude API key — enter it in the bar above');
  const res = await fetch('/vary-prompts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt, count, anthropicKey }),
  });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(`Server error: ${text.slice(0, 120)}`); }
  if (!res.ok || data.error) throw new Error(data.error || 'vary-prompts failed');
  return data.prompts;
}

async function generateScene(sid) {
  const apiKey = getKey();
  if (!apiKey) { alert('Enter your Replicate API key first.'); return; }
  const s = scenes[sid];
  if (s.endpoint !== 'models' && !s.imageBase64) { alert('Upload a source image for Scene ' + (sid+1)); return; }

  document.getElementById(`gbtn-${sid}`).disabled = true;
  document.getElementById(`gbtn-${sid}`).textContent = '⏳ Generating...';
  document.getElementById(`prog-${sid}`).style.display = 'block';
  document.getElementById(`vout-${sid}`).innerHTML = '';
  completedByScene[sid] = [];
  setStatus(sid, 'running', `Starting ${s.variations} variation${s.variations>1?'s':''}...`);
  addLog(sid, `Model: ${s.model} | Variations: ${s.variations}`);

  const baseSeed = s.seed ? parseInt(s.seed) : (Math.floor(Math.random() * 900000) + 1);

  s._variedPrompts = null;
  if (s.aiVary && s.prompt) {
    addLog(sid, `🎨 Asking Claude to vary prompt x${s.variations}...`);
    try {
      s._variedPrompts = await varyPrompts(s.prompt, s.variations);
      s._variedPrompts.forEach((p, i) => addLog(sid, `Var ${i+1}: ${p.slice(0,60)}...`));
    } catch(e) { addLog(sid, 'AI vary error: ' + e.message, 'error'); }
  }

  let version = null;
  if (s.endpoint === 'versions') {
    try { version = await getModelVersion(s.model, apiKey, sid); }
    catch(e) { addLog(sid, 'Version fetch error: ' + e.message, 'error'); resetBtn(sid); return; }
  }

  for (let i = 0; i < s.variations; i++) {
    const label = (s._variedPrompts && s._variedPrompts[i]) ? s._variedPrompts[i].slice(0, 55) + '…' : null;
    document.getElementById(`vout-${sid}`).appendChild(makeVarCard(sid, i, label));
  }

  const jobs = Array.from({ length: s.variations }, (_, i) =>
    sleep(i * 2000).then(() => runVar(sid, i, baseSeed + i, apiKey, version))
  );

  const results = await Promise.allSettled(jobs);
  const ok = results.filter(r => r.status === 'fulfilled').length;
  const fail = results.filter(r => r.status === 'rejected').length;

  document.getElementById(`prog-${sid}`).style.display = 'none';
  if (fail === 0) setStatus(sid, 'done', `${ok} done ✓`);
  else if (ok > 0) setStatus(sid, 'done', `${ok} done, ${fail} failed`);
  else setStatus(sid, 'error', 'Failed');
  resetBtn(sid);
}

async function generateAll() {
  const btn = document.getElementById('gen-all-btn');
  btn.disabled = true; btn.textContent = '⏳ Generating All...';
  await Promise.allSettled(scenes.map(s => generateScene(s.id)));
  btn.disabled = false; btn.textContent = '⚡ Generate All Scenes';
}

async function runVar(sid, varIdx, seed, apiKey, version) {
  const s = scenes[sid];
  const card = document.getElementById(`vcard-${sid}-${varIdx}`);
  const statusEl = card.querySelector('.vc-status');
  const progressEl = card.querySelector('.vc-prog');
  const placeholder = card.querySelector('.video-placeholder');
  const videoWrap = card.querySelector('.video-wrap');
  const dlBtn = card.querySelector('.dl-btn');

  statusEl.textContent = 'Starting...';
  progressEl.style.display = 'block';

  try {
    const input = buildInput(sid, seed, varIdx);
    let res;
    if (s.endpoint === 'models') {
      res = await fetch(`/api/models/${s.model}/predictions`, {
        method: 'POST',
        headers: { 'Authorization': 'Token ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ input }),
      });
    } else {
      res = await fetch('/api/predictions', {
        method: 'POST',
        headers: { 'Authorization': 'Token ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ version, input }),
      });
    }
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || JSON.stringify(e)); }
    const pred = await res.json();
    addLog(sid, `Var ${varIdx+1} ID: ${pred.id} | seed: ${seed}`);
    statusEl.textContent = 'Processing...';

    const url = await pollPrediction(pred.id, apiKey, statusEl);

    const video = card.querySelector('video');
    video.src = url; video.load(); video.play().catch(() => {});
    placeholder.style.display = 'none';
    progressEl.style.display = 'none';
    videoWrap.style.display = 'block';
    card.querySelector('.play-icon').textContent = '⏸';
    statusEl.textContent = 'Done ✓'; statusEl.style.color = '#4ade80';
    dlBtn.style.display = 'block';
    dlBtn.onclick = () => triggerDownload(url, `scene${sid+1}-var${varIdx+1}-seed${seed}.mp4`);

    if (!completedByScene[sid]) completedByScene[sid] = [];
    completedByScene[sid].push({ url, varIdx, seed });
    addLog(sid, `Var ${varIdx+1} done`, 'success');

  } catch(err) {
    addLog(sid, `Var ${varIdx+1} error: ${err.message}`, 'error');
    statusEl.textContent = 'Failed'; statusEl.style.color = '#f87171';
    progressEl.style.display = 'none';
    throw err;
  }
}

async function pollPrediction(id, apiKey, statusEl) {
  const maxWait = 600000; const interval = 3000; let elapsed = 0;
  while (elapsed < maxWait) {
    await sleep(interval); elapsed += interval;
    const res = await fetch(`/api/predictions/${id}`, { headers: { 'Authorization': 'Token ' + apiKey } });
    const data = await res.json();
    if (statusEl) statusEl.textContent = data.status.charAt(0).toUpperCase() + data.status.slice(1) + '...';
    if (data.status === 'succeeded') return Array.isArray(data.output) ? data.output[0] : data.output;
    if (data.status === 'failed' || data.status === 'canceled') throw new Error(data.error || 'Prediction ' + data.status);
  }
  throw new Error('Timed out');
}

async function getModelVersion(modelId, apiKey, sid) {
  if (versionCache[modelId]) return versionCache[modelId];
  const res = await fetch(`/api/models/${modelId}/versions`, { headers: { 'Authorization': 'Token ' + apiKey } });
  if (!res.ok) throw new Error('Could not fetch versions');
  const data = await res.json();
  const v = data.results[0].id;
  versionCache[modelId] = v;
  if (sid != null) addLog(sid, 'Version: ' + v.slice(0, 12) + '...');
  return v;
}

function syncAll() {

function fvcHandleImg(e, idx) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fvc.images[idx] = ev.target.result;
    // Show thumbnail

    thumb.src = ev.target.result;
    thumb.classList.add('loaded');

    document.getElementById(`fvc-utxt-${idx}`).style.display = 'none';
    // Auto-analyze if Claude key is ready
    if (getAnthropicKey()) fvcAnalyzeImage(idx);
  };
  reader.readAsDataURL(file);
}

async function fvcAnalyzeImage(idx) {
  const key = getAnthropicKey();
  if (!key || !fvc.images[idx]) return;
  const descEl = document.getElementById(`fvc-desc-${idx}`);
  descEl.className = 'fvc-desc-box analyzing';
  descEl.textContent = '🔍 Analyzing with Claude…';
  try {
    const res = await fetch('/describe-images', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ images: [fvc.images[idx]], anthropicKey: key }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    fvc.descriptions[idx] = data.description;
    descEl.className = 'fvc-desc-box done';
    descEl.textContent = data.description;
  } catch(e) {
    descEl.className = 'fvc-desc-box err';
    descEl.textContent = '⚠ ' + e.message;
  }
}

async function fvcAnalyzeAll() {
  const key = getAnthropicKey();
  if (!key) { alert('Enter your Claude API key first.'); return; }
  const loaded = fvc.images.filter(Boolean);
  if (!loaded.length) { alert('Upload at least one image first.'); return; }
  const btn = document.getElementById('fvc-analyze-btn');
  btn.disabled = true; btn.textContent = '🔍 Analyzing…';
  await Promise.all(fvc.images.map((img, i) => img ? fvcAnalyzeImage(i) : Promise.resolve()));
  btn.disabled = false; btn.textContent = '🔍 Re-analyze with Claude';
}

function fvcSetNumScenes(n) {
  fvc.numScenes = n;
  // Resize scenePrompts array
  while (fvc.scenePrompts.length < n) fvc.scenePrompts.push('');
  fvc.scenePrompts = fvc.scenePrompts.slice(0, n);
  // Update chip UI
  document.querySelectorAll('#fvc-scene-count .chip').forEach(b => b.classList.toggle('active', +b.dataset.n === n));
  // Update labels
  const lbl = document.getElementById('fvc-scene-count-label');

  const genLbl = document.getElementById('fvc-gen-label');
  if (genLbl) genLbl.textContent = n;
  const watchLbl = document.getElementById('fvc-watch-label');
  if (watchLbl) watchLbl.textContent = n;

  const watchWrap = document.getElementById('fvc-watch-wrap');

  renderFvcPromptBoxes();
}

function renderFvcPromptBoxes() {
  const container = document.getElementById('fvc-prompt-boxes');

  container.innerHTML = '';
  for (let i = 0; i < fvc.numScenes; i++) {

      </div>

async function fvcBuildScenePrompts() {
  const key = getAnthropicKey();

  const descriptions = fvc.descriptions.filter(Boolean).join('\n\n');
  if (!descriptions && !fvc.goal && !fvc.subject) {
    alert('Add at least a video goal or upload an image first.');
    return;
  }

  const btn = document.getElementById('fvc-build-btn');
  btn.disabled = true; btn.textContent = `✨ Building ${fvc.numScenes} scene prompts…`;

  try {
    const res = await fetch('/build-scene-prompts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        description: descriptions,
        userGoal: fvc.goal,
        numScenes: fvc.numScenes,
        storyArc: fvc.storyArc,
        pacing: fvc.pacing,
        tone: fvc.tone,
        subject: fvc.subject,
        storyNotes: fvc.storyNotes,
        angle: fvc.angle,
        lighting: fvc.lighting,
        movement: fvc.movement,
        mood: fvc.mood,
        focus: fvc.focus,
        anthropicKey: key,
      }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (!data.scenes || !data.scenes.length) throw new Error('No scenes returned');

    const boxes = document.getElementById('fvc-prompt-boxes');
    boxes.style.borderLeft = '2px solid #6366f1';

  } finally {
    btn.disabled = false; btn.textContent = '✨ Build Scene Prompts with Claude';
  }
}

// ============================================================
// Full Video Creator — generate full video
// ============================================================
async function fvcGenerate() {
  const apiKey = getKey();
  if (!apiKey) { alert('Enter your Replicate API key first.'); return; }

  // Collect prompts from textareas (in case user edited them)
  for (let i = 0; i < fvc.numScenes; i++) {
    const ta = document.getElementById(`fvc-scene-prompt-${i}`);
    if (ta) fvc.scenePrompts[i] = ta.value.trim();
  }

  const filledPrompts = fvc.scenePrompts.slice(0, fvc.numScenes).filter(p => p.trim());
  if (!filledPrompts.length) { alert('Build or write scene prompts first (Step 5).'); return; }

  const btn = document.getElementById('fvc-gen-btn');
  btn.disabled = true; btn.textContent = `⏳ Generating ${fvc.numScenes} scenes…`;
  document.getElementById('fvc-prog').style.display = 'block';
  document.getElementById('fvc-vout').innerHTML = '';
  document.getElementById('fvc-log').innerHTML = '';

  const sourceImg = fvc.images.find(Boolean) || null;

  // Get version if needed
  let version = null;
  if (fvc.endpoint === 'versions') {
    try {
      version = await getModelVersion(fvc.model, apiKey, null);
      fvcLog('Version: ' + version.slice(0, 12) + '...');
    } catch(e) {
      fvcLog('Version fetch error: ' + e.message, 'error');
      fvcResetBtn(); return;
    }
  }

  // Create all scene cards first (in order)
  const vout = document.getElementById('fvc-vout');
  for (let i = 0; i < fvc.numScenes; i++) {
    if (fvc.scenePrompts[i]?.trim()) vout.appendChild(makeFvcSceneCard(i));
  }

  // Generate scenes with stagger (avoid rate limits)
  const jobs = [];
  for (let i = 0; i < fvc.numScenes; i++) {
    const prompt = fvc.scenePrompts[i]?.trim();
    if (!prompt) continue;
    const seed = Math.floor(Math.random() * 900000) + 1;
    jobs.push(sleep(i * 2500).then(() => runFvcScene(i, seed, apiKey, version, prompt, sourceImg)));
  }

  const results = await Promise.allSettled(jobs);
  document.getElementById('fvc-prog').style.display = 'none';
  const ok = results.filter(r => r.status === 'fulfilled').length;
  const fail = results.filter(r => r.status === 'rejected').length;
  fvcLog(fail === 0 ? `All ${ok} scenes done ✓` : `${ok} done, ${fail} failed`, fail === 0 ? 'success' : 'warn');
  fvcResetBtn();

  // Show Watch Full Video button if at least one scene succeeded
  if (ok > 0) {
    const wrap = document.getElementById('fvc-watch-wrap');
    const lbl = document.getElementById('fvc-watch-label');
    if (wrap) { wrap.style.display = 'block'; if (lbl) lbl.textContent = ok; }
  }
}

// ============================================================
// Full Video Creator — sequential playback modal
// ============================================================
function fvcWatchFullVideo() {
  // Collect all generated scene video src URLs in order
  const srcs = [];
  for (let i = 0; i < fvc.numScenes; i++) {
    const card = document.getElementById(`fvc-scene-card-${i}`);
    if (!card) continue;
    const vid = card.querySelector('video');
    if (vid && vid.src && vid.src !== window.location.href) srcs.push({ src: vid.src, label: `Scene ${i+1} of ${fvc.numScenes}` });
  }
  if (!srcs.length) { alert('No completed scenes found.'); return; }

  // Build modal
  const overlay = document.createElement('div');
  overlay.id = 'fvc-modal';
  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.96);z-index:9999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  `;

  let current = 0;

  const sceneLabel = document.createElement('div');
  sceneLabel.style.cssText = 'color:#a5b4fc;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase';
  sceneLabel.textContent = srcs[0].label;

  // Progress dots
  const dots = document.createElement('div');
  dots.style.cssText = 'display:flex;gap:6px';
  srcs.forEach((_, i) => {
    const d = document.createElement('div');
    d.id = `fvc-dot-${i}`;
    d.style.cssText = `width:8px;height:8px;border-radius:50%;background:${i===0?'#6366f1':'#2a2a4a'};transition:background 0.3s`;
    dots.appendChild(d);
  });

  const video = document.createElement('video');
  video.style.cssText = 'max-width:88vw;max-height:72vh;border-radius:12px;background:#000;box-shadow:0 0 60px rgba(0,0,0,0.8)';
  video.controls = true;
  video.autoplay = true;
  video.src = srcs[0].src;

  // Next scene label preview
  const nextLabel = document.createElement('div');
  nextLabel.style.cssText = 'font-size:11px;color:#4b5563';
  nextLabel.textContent = srcs.length > 1 ? `Up next: ${srcs[1].label}` : '';

  const controls = document.createElement('div');
  controls.style.cssText = 'display:flex;gap:10px;align-items:center';

  const prevBtn = document.createElement('button');
  prevBtn.textContent = '⏮ Prev';
  prevBtn.style.cssText = 'background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:7px 16px;color:#e0e0e8;cursor:pointer;font-size:12px';

  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Next ⏭';
  nextBtn.style.cssText = prevBtn.style.cssText;

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Close';
  closeBtn.style.cssText = 'background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 16px;color:#6b7280;cursor:pointer;font-size:12px';

  controls.appendChild(prevBtn);
  controls.appendChild(nextBtn);
  controls.appendChild(closeBtn);

  function goTo(idx) {
    if (idx < 0 || idx >= srcs.length) return;
    current = idx;
    video.src = srcs[current].src;
    video.play().catch(()=>{});
    sceneLabel.textContent = srcs[current].label;
    nextLabel.textContent = current < srcs.length - 1 ? `Up next: ${srcs[current+1].label}` : '🎬 Last scene';
    // Update dots
    srcs.forEach((_, i) => {
      const d = document.getElementById(`fvc-dot-${i}`);
      if (d) d.style.background = i === current ? '#6366f1' : i < current ? '#4ade80' : '#2a2a4a';
    });
  }

  video.addEventListener('ended', () => {
    if (current + 1 < srcs.length) goTo(current + 1);
    else { sceneLabel.textContent = '🎬 Full video complete'; nextLabel.textContent = ''; }
  });

  prevBtn.onclick = () => goTo(current - 1);
  nextBtn.onclick = () => goTo(current + 1);
  closeBtn.onclick = () => { video.pause(); document.body.removeChild(overlay); };
  overlay.addEventListener('click', e => { if (e.target === overlay) { video.pause(); document.body.removeChild(overlay); } });

  overlay.appendChild(sceneLabel);
  overlay.appendChild(dots);
  overlay.appendChild(video);
  overlay.appendChild(nextLabel);
  overlay.appendChild(controls);
  document.body.appendChild(overlay);
}

function makeFvcSceneCard(sceneIdx) {
  const div = document.createElement('div');
  div.className = 'video-card';
  div.id = `fvc-scene-card-${sceneIdx}`;
  const label = sceneIdx === 0 ? 'Opening' : sceneIdx === fvc.numScenes - 1 ? 'Closing' : `Scene ${sceneIdx + 1}`;
  const promptPreview = (fvc.scenePrompts[sceneIdx] || '').slice(0, 70) + ((fvc.scenePrompts[sceneIdx] || '').length > 70 ? '…' : '');
  div.innerHTML = `
    <div class="video-card-header" style="flex-direction:column;align-items:flex-start;gap:3px;padding:10px 12px">
      <div style="display:flex;width:100%;align-items:center;justify-content:space-between">
        <span style="font-size:12px;font-weight:700;color:#a5b4fc">Scene ${sceneIdx+1} of ${fvc.numScenes} · ${label}</span>
        <span class="vc-status" style="font-size:10px;color:#6b7280">Queued</span>
      </div>
      <span style="font-size:10px;color:#4b5563;font-style:italic">${promptPreview}</span>
    </div>
    <div class="vc-prog progress-wrap" style="display:none;margin:6px 8px 0;"><div class="progress-bar"></div></div>
    <div class="video-placeholder"><div style="font-size:24px">🎥</div></div>
    <div class="video-wrap">
      <video loop playsinline muted style="width:100%;max-height:260px;display:block;pointer-events:none;"></video>
      <div class="video-overlay" onclick="togglePlay(this)"><div class="play-icon">▶</div></div>
    </div>
    <button class="dl-btn">⬇️ Download Scene ${sceneIdx+1}</button>
  `;
  return div;
}

async function runFvcScene(sceneIdx, seed, apiKey, version, prompt, sourceImg) {
  const card = document.getElementById(`fvc-scene-card-${sceneIdx}`);
  const statusEl = card.querySelector('.vc-status');
  const progressEl = card.querySelector('.vc-prog');
  const placeholder = card.querySelector('.video-placeholder');
  const videoWrap = card.querySelector('.video-wrap');
  const dlBtn = card.querySelector('.dl-btn');

  statusEl.textContent = 'Starting...';
  progressEl.style.display = 'block';
  fvcLog(`Scene ${sceneIdx+1}: starting | seed: ${seed}`);

  try {
    const sceneObj = {
      model: fvc.model, endpoint: fvc.endpoint,
      imageBase64: sourceImg,
      prompt, negPrompt: '',
      ratio: fvc.ratio, sdResolution: fvc.sdResolution, sdDuration: fvc.sdDuration,
      sdAuto: false, sdAudio: true, motion: 5, fps: 24, cfg: 7, duration: 5,
      seed: '', _variedPrompts: null,
    };
    const input = buildInputFromScene(sceneObj, seed, 0);

    let res;
    if (fvc.endpoint === 'models') {
      res = await fetch(`/api/models/${fvc.model}/predictions`, {
        method: 'POST',
        headers: { 'Authorization': 'Token ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ input }),
      });
    } else {
      res = await fetch('/api/predictions', {
        method: 'POST',
        headers: { 'Authorization': 'Token ' + apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ version, input }),
      });
    }
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || JSON.stringify(e)); }
    const pred = await res.json();
    fvcLog(`Scene ${sceneIdx+1}: ID ${pred.id}`);
    statusEl.textContent = 'Processing...';

    const url = await pollPrediction(pred.id, apiKey, statusEl);

    const video = card.querySelector('video');
    video.src = url; video.load(); video.play().catch(() => {});
    placeholder.style.display = 'none';
    progressEl.style.display = 'none';
    videoWrap.style.display = 'block';
    card.querySelector('.play-icon').textContent = '⏸';
    statusEl.textContent = 'Done ✓'; statusEl.style.color = '#4ade80';
    dlBtn.style.display = 'block';
    dlBtn.onclick = () => triggerDownload(url, `scene-${sceneIdx+1}-of-${fvc.numScenes}-seed${seed}.mp4`);
    fvcLog(`Scene ${sceneIdx+1}: done ✓`, 'success');

  } catch(err) {
    fvcLog(`Scene ${sceneIdx+1} error: ${err.message}`, 'error');
    statusEl.textContent = 'Failed'; statusEl.style.color = '#f87171';
    progressEl.style.display = 'none';
    throw err;
  }
}

function fvcLog(msg, type = 'info') {
  const box = document.getElementById('fvc-log');
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  box.appendChild(line); box.scrollTop = box.scrollHeight;
}

function fvcResetBtn() {
  const btn = document.getElementById('fvc-gen-btn');
  btn.disabled = false; btn.textContent = '⚡ Generate Video';
}

// ============================================================
// Shared helpers
// ============================================================
function togglePlay(overlay) {
  const video = overlay.closest('.video-wrap').querySelector('video');
  const icon = overlay.querySelector('.play-icon');
  if (video.paused) { video.play(); icon.textContent = '⏸'; }
  else { video.pause(); icon.textContent = '▶'; }
}

function triggerDownload(url, filename) {
  const proxyUrl = `/download?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(filename)}`;
  const a = document.createElement('a');
  a.href = proxyUrl; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => document.body.removeChild(a), 1000);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const _origError = console.error.bind(console);
console.error = (...args) => {
  _origError(...args);
  const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
  for (let i = 0; i < NUM_SCENES; i++) addLog(i, '⚠ ' + msg, 'error');
};
window.addEventListener('unhandledrejection', e => {
  const msg = e.reason?.message || String(e.reason);
  for (let i = 0; i < NUM_SCENES; i++) addLog(i, '⚠ Unhandled: ' + msg, 'error');
});
</script>
